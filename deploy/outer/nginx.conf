# Replaces the existing manually managed codex-usage outer virtual host.
map $http_upgrade $codex_usage_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name codex-usage.outer.r9s.net;
    return 301 https://codex-usage.outer.r9s.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codex-usage.outer.r9s.net;
    ssl_certificate /etc/nginx/ssl/outer.r9s.net.fullchain.cer;
    ssl_certificate_key /etc/ssl/private/outer.r9s.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    set $r9s_access_app_id codex-usage;

    location / {
        include /etc/nginx/snippets/protected-location.conf;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-R9S-App-ID "";
        proxy_set_header X-Original-Host "";
        proxy_set_header X-Original-URI "";
        proxy_set_header X-Original-Method "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $codex_usage_connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_pass http://127.0.0.1:8501;
    }

    include /etc/nginx/snippets/r9s-access-snippet.conf;
}
